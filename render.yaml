# Render blueprint — deploys both services from a single repo connection.
# Render reads this file when you choose "New → Blueprint" on the dashboard.
#
# Free-tier notes:
#   • Web service sleeps after 15 min idle (cold start ~30s on wake).
#   • Static site serves from CDN — never sleeps.
#   • Persistent disk is NOT available on free tier. SQLite lives in the
#     container's ephemeral filesystem — restarts/redeploys lose data.
#     For closed beta this is acceptable (users re-sign-in if needed).
#     Upgrade to Starter ($7/mo) for persistent disk, OR migrate to
#     Render Postgres free tier (90 days) when you outgrow ephemeral storage.
#
# Required secrets — set these in the Render dashboard, NOT here:
#   USDA_FDC_API_KEY        — USDA FoodData Central (free)
#   ANTHROPIC_API_KEY       — Claude API (for OCR + bot)
#   RESEND_API_KEY          — for OTP email delivery
#   INVITE_CODES            — comma-separated beta access codes
#   FRONTEND_URL            — frontend static-site URL (set after first deploy)
#   AUTH_SECRET             — auto-generated by Render

services:
  # ── Backend: FastAPI ────────────────────────────────────────────────
  - type: web
    name: nouri-scan-api
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FRONTEND_URL
        # Replace with your actual static-site URL after first deploy
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: USDA_FDC_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Nouri Scan <onboarding@resend.dev>
      - key: INVITE_CODES
        value: NOURI-FAMILY,NOURI-BETA,POSHAN-2026
      - key: AUTH_SESSION_DAYS
        value: "30"
      - key: OTP_TTL_MINUTES
        value: "10"
      - key: OTP_MAX_PER_HOUR
        value: "5"
      # Persistent database (Turso). Set both in the dashboard.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Emails that see the in-app analytics dashboard.
      - key: ADMIN_EMAILS
        sync: false
      # Emails that skip the invite gate on sign-in (safety net for returning
      # beta testers after an infrastructure event).
      - key: KNOWN_USERS
        sync: false
      # App Store review bypass — REVIEW_EMAIL skips the invite gate and
      # accepts REVIEW_OTP directly instead of emailing a code. Both must be
      # set for it to activate. UNSET BOTH once the app is approved.
      - key: REVIEW_EMAIL
        sync: false
      - key: REVIEW_OTP
        sync: false

  # ── Frontend: React static site (always free, global CDN) ──────────────
  - type: web
    name: nouri-scan
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    # Routes are evaluated in order. The privacy policy is a standalone static
    # page, so it must be matched BEFORE the SPA catch-all below — otherwise
    # /privacy gets rewritten to index.html and serves the React app instead.
    # App Store Connect and the app's own footer both point at /privacy.
    routes:
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      # SPA routing — every remaining path serves index.html (React handles
      # client-side routing)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        # Set to https://nouri-scan-api.onrender.com after API deploys.
        # Render rebuilds the static site automatically when this changes.
        sync: false
